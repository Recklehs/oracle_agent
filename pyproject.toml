[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[project]
name = "oracle-agent"
version = "0.1.0"
description = "Prediction market resolution agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic-ai[web-fetch]",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]
